services:
  - type: web
    name: bybit-scalping-terminal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BYBIT_TESTNET
        value: "false"
      - key: BYBIT_BASE_URL
        value: "https://api.bybit.com"
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: TERMINAL_ACCESS_TOKEN
        sync: false
